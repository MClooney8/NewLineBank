<!DOCTYPE html>
<html>
<head>
  <title>New Line Trust Bank</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    html,body,h1,h2,h3,h4,h5 {
      font-family: "Raleway", sans-serif;
    }
    .w3-container {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
    }
    .w3-button {
      background-color: #4CAF50;
      color: #fff;
    }
    .w3-green {
      background-color: #4CAF50;
    }
    body {
      background-color: #fff;
    }
    .balance-text {
      font-size: 36px;
      font-weight: bold;
    }
    .w3-sidebar {
      height: 100%;
      overflow: auto;
      position: fixed;
    }
    .w3-main {
      margin-left: 300px;
      padding-top: 43px;
    }
  </style>
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-striped w3-black w3-small">
    <span class="w3-bar-item">
      <a href="domsitee1.html">
        <img src="Newline.png" style="height: 82px;">
      </a>
    </span>
    <div class="w3-center">
      <h1>New Line Trust Bank</h1>
    </div>
    <span class="w3-bar-item w3-right">
      <a href="index.html">
        <button class="w3-button w3-small w3-black">
          <i class="fa fa-sign-out"></i> Logout
        </button>
      </a>
    </span>
  </div>

  <!-- Sidebar -->
  <nav class="w3-sidebar w3-collapse w3-white w3-animate-left" style="z-index:3;width:300px;" id="mySidebar">
    <div class="w3-container w3-row">
      <div class="w3-col s8 w3-bar">
        <span>Welcome, <strong>Flores, Tarik</strong></span><br>
      </div>
      <div class="w3-col s4">
        <img src="Flores.jpg" alt="Profile Picture" style="width:100%;height: 80px;border-radius:100%;margin-top:20px;">
      </div>
    </div>
    <hr>
    <div class="w3-container">
      <h5>Services</h5>
    </div>
    <div class="w3-bar-block">
      <a href="#" class="w3-bar-item w3-button w3-padding w3-blue"><i class="fa fa-users fa-fw"></i> Overview</a>
      <a href="send.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-money fa-fw"></i> Send Money</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-laptop fa-fw"></i> Pay bills</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-credit-card fa-fw"></i> Request Credit Card</a>
      <a href="#" class="w3-bar-item w3-button w3-padding" onclick="location.href='mailto:fidelityamericatrust@gmail.com'"><i class="fa fa-balance-scale fa-fw"></i> Dispute Resolution</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-history fa-fw"></i> History</a>
      <a href="profile.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-user fa-fw"></i> Profile</a>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="w3-main">
    <header class="w3-container">
      <h5><b><i class="fa fa-dashboard"></i> My Dashboard</b></h5>
    </header>

    <div class="w3-row-padding w3-margin-bottom">
      <div class="w3-full">
        <div class="w3-container w3-green w3-padding-50">
          <div class="w3-left"><i class="fa fa-money w3-xxxlarge"></i></div>
          <div class="w3-clear w3-animate-opacity w3-center">
            <h4>Available Balance</h4>
            <span id="balance" class="balance-text"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="w3-container">
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='send.html'">
        <i class="fa fa-money" style="margin-right: 10px;"></i> Transfers
      </button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://www.kayak.com/flights'">
        <i class="fa fa-plane" style="margin-right: 10px;"></i> Book a Flight
      </button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://www.booking.com/'">
        <i class="fa fa-hotel"></i> Hotel Reservation
      </button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://bitcoin.org/en/'">
        <i class="fa fa-bitcoin"></i> Buy Bitcoin
      </button>
    </div>
  </div>

  <footer class="w3-container w3-padding-16 w3-light-grey">
    <p>Powered by <a href="#" target="_blank">LiisH</a></p>
  </footer>

  <script>
    window.addEventListener('load', function () {
      updateBalance();
    });

    function updateBalance() {
      let storedBalance = localStorage.getItem('balance');
      if (!storedBalance) {
        const initialBalance = (Math.random() * (550000.91 - 510000.86) + 510000.86).toFixed(2);
        storedBalance = initialBalance;
        localStorage.setItem('balance', storedBalance);
      }

      const balance = parseFloat(storedBalance);
      document.getElementById('balance').textContent = '$' + balance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  </script>
</body>
</html>
