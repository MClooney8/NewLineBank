<!DOCTYPE html>
<html>
<head>
  <title>New Line Trust Bank</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    html,body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}

    @media only screen and (max-width: 600px) {
      .w3-container {
        width: 90%;
      }
      #chat-log {
        height: 200px;
      }
    }

    .w3-container {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
    }

    .w3-container.w3-green.w3-padding-50:hover {
      background-color: #000;
    }

    body {
      background-color: #fff;
    }

    .w3-bar {
      background-color: #ffffff;
    }

    .w3-button {
      background-color: #4CAF50;
      color: #fff;
    }

    .w3-green {
      background-color: #4CAF50;
    }

    .w3-border-green {
      border-color: #4CAF50;
    }

    .w3-text-green {
      color: #4CAF50;
    }

    footer {
      position: sticky;
      bottom: 0;
      width: 100%;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .balance-text {
      font-size: 50px;
      font-weight: bold;
    }
  </style>
</head>
<body class="w3-light-grey">

  <!-- Top container -->
  <div class="w3-container-fluid">
    <div class="w3-bar w3-striped w3-black w3-small" style="z-index: 8;">
      <span class="w3-bar-item w3-animate-left">
        <a href="domsitee.html">
          <img src="Newline.png" style="height: 82px; margin-top: 0px;">
        </a>
      </span>
      <h1 style="display: flex; justify-content: center;">New Line Trust Bank</h1>
      <span class="w3-bar-item w3-right">
        <a href="index.html">
          <button class="w3-button w3-small w3-black">
            <i class="fa fa-sign-out"></i> Logout
          </button>
        </a>
      </span>
    </div>
  </div>

  <!-- Sidebar/menu -->
  <nav class="w3-sidebar w3-collapse w3-white w3-animate-left" style="z-index:3;width:300px;" id="mySidebar"><br>
    <div class="w3-container-fluid w3-row">
      <div class="w3-col s8 w3-bar">
        <span>Welcome, <strong>Flores, Tarik</strong></span><br>
        <div class="w3-col s4">
          <img src="Flores.jpg" alt="Profile Picture" style="width:100%;height: 80px;border-radius:100%;margin-top:20px;">
        </div>
      </div>
      <div id="date-time"></div>
      <script>
        setInterval(function() {
          var currentDateTime = new Date();
          var formattedDateTime = currentDateTime.toLocaleString();
          document.getElementById("date-time").innerHTML = formattedDateTime;
        }, 1000);
      </script>
    </div>

    <hr>
    <div class="w3-container-fluid">
      <h5>Services</h5>
    </div>
    <div class="w3-bar-block">
      <a href="#" class="w3-bar-item w3-button w3-padding-16 w3-hide-large w3-dark-grey w3-hover-black" onclick="w3_close()" title="close menu"><i class="fa fa-remove fa-fw"></i> Close Menu</a>
      <a href="#" class="w3-bar-item w3-button w3-padding w3-blue"><i class="fa fa-users fa-fw"></i> Overview</a>
      <a href="send.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-money fa-fw"></i> Send Money</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-laptop fa-fw"></i> Pay bills</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-credit-card fa-fw"></i> Request Credit Card</a>
      <a href="#" class="w3-bar-item w3-button w3-padding" onclick="location.href='mailto:fidelityamericatrust@gmail.com'"><i class="fa fa-balance-scale fa-fw"></i> Dispute Resolution</a>
      <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-history fa-fw"></i> History</a>
      <a href="profile.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-user fa-fw"></i> Profile</a><br><br>
    </div>
  </nav>

  <!-- Overlay effect -->
  <div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" title="close side menu" id="myOverlay"></div>

  <!-- Main content -->
  <div class="w3-main" style="margin-left:300px;margin-top:43px;">

    <header class="w3-container-fluid" style="padding-top:22px">
      <h5><b><i class="fa fa-dashboard"></i> My Dashboard</b></h5>
    </header>

    <div class="w3-row-padding w3-margin-bottom">
      <div class="w3-full">
        <div class="w3-container w3-green w3-padding-50" style="transition: background-color 0.5s;">
          <div class="w3-left"><i class="fa fa-money w3-xxxlarge"></i></div>
          <div class="w3-clear w3-animate-opacity w3-center">
            <h4>Available Balance</h4>
            <span id="balance" style="font-size: 36px; font-weight: bold;"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="w3-container-fluid">
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='send.html'"><i class="fa fa-money" style="margin-right: 10px;"> Transfers </i></button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://www.kayak.com/flights'"><i class="fa fa-plane" style="margin-right: 10px;"></i> Book a Flight </button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://www.booking.com/'"><i class="fa fa-hotel"> Hotel Reservation </i></button>
      <button class="w3-button w3-large w3-black w3-margin-bottom" onclick="location.href='https://bitcoin.org/en/'"><i class="fa fa-bitcoin"> Buy Bitcoin </i></button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w3-container-fluid w3-padding-16 w3-light-grey">
    <p>Powered by <a href="@LiisH" target="_blank">LiisH</a></p>
  </footer>

  <!-- Script -->
  <script>
    // Run on page load
    window.addEventListener('load', function() {
      updateBalance();
    });

    function updateBalance() {
      var storedBalance = localStorage.getItem('balance');
      
      // If no balance saved, generate a random one between 510000.86 and 550000.91
      if (!storedBalance) {
        var min = 510000.86;
        var max = 550000.91;
        var randomBalance = Math.random() * (max - min) + min;
        randomBalance = parseFloat(randomBalance.toFixed(2));
        localStorage.setItem('balance', randomBalance);
        storedBalance = randomBalance;
      }

      document.getElementById('balance').innerHTML = '$' + parseFloat(storedBalance).toLocaleString();
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
