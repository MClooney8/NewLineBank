<!DOCTYPE html>
<html>
<head>
  <title>New Line Trust Bank</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    html, body, h1, h2, h3, h4, h5 {
      font-family: "Raleway", sans-serif;
    }
    body {
      background-color: #fff;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    .w3-container {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
    }
    .w3-button {
      background-color: #4CAF50;
      color: #fff;
    }
    .w3-green {
      background-color: #4CAF50;
    }
    .balance-text {
      font-size: 36px;
      font-weight: bold;
    }
    .layout {
      display: flex;
      height: calc(100vh - 82px);
    }
    .sidebar {
      width: 300px;
      background-color: #fff;
      overflow-y: auto;
      flex-shrink: 0;
      border-right: 1px solid #ccc;
      height: 100vh;
      position: relative;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
    }
    .form-input {
      margin-bottom: 15px;
    }
  </style>
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-striped w3-black w3-small top-bar">
    <span class="w3-bar-item">
      <a href="domsitee.html">
        <img src="Newline.png" style="height: 82px;">
      </a>
    </span>
    <div class="w3-center">
      <h1>New Line Trust Bank</h1>
    </div>
    <span class="w3-bar-item w3-right">
      <a href="index.html">
        <button class="w3-button w3-small w3-black">
          <i class="fa fa-sign-out"></i> Logout
        </button>
      </a>
    </span>
  </div>

  <div class="layout" style="margin-top: 82px;">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="w3-container w3-row">
        <div class="w3-col s8 w3-bar">
          <span>Welcome, <strong>Greg, Thompson</strong></span><br>
        </div>
        <div class="w3-col s4">
          <img src="gthomp.jpeg" alt="Profile Picture" style="width:100%;height: 80px;border-radius:100%;margin-top:20px;">
        </div>
      </div>
      <hr>
      <div class="w3-container">
        <h5>Services</h5>
      </div>
      <div class="w3-bar-block">
        <a href="#" class="w3-bar-item w3-button w3-padding w3-blue"><i class="fa fa-users fa-fw"></i> Overview</a>
        <a href="send.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-money fa-fw"></i> Send Money</a>
        <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-laptop fa-fw"></i> Pay bills</a>
        <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-credit-card fa-fw"></i> Request Credit Card</a>
        <a href="#" class="w3-bar-item w3-button w3-padding" onclick="location.href='mailto:fidelityamericatrust@gmail.com'"><i class="fa fa-balance-scale fa-fw"></i> Dispute Resolution</a>
        <a href="#" class="w3-bar-item w3-button w3-padding"><i class="fa fa-history fa-fw"></i> History</a>
        <a href="profile.html" class="w3-bar-item w3-button w3-padding"><i class="fa fa-user fa-fw"></i> Profile</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <header class="w3-container">
        <h5><b><i class="fa fa-dashboard"></i> Send Money</b></h5>
      </header>

      <div class="w3-row-padding w3-margin-bottom">
        <div class="w3-full">
          <div class="w3-container w3-green w3-padding-50">
            <div class="w3-left"><i class="fa fa-money w3-xxxlarge"></i></div>
            <div class="w3-clear w3-animate-opacity w3-center">
              <h4>Available Balance</h4>
              <span id="balance" class="balance-text"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="w3-container">
        <form onsubmit="return handleTransfer(event)">
          <div class="form-input">
            <label>Recipient Name</label>
            <input class="w3-input w3-border" id="recipient" required>
          </div>
          <div class="form-input">
            <label>Account Number</label>
            <input class="w3-input w3-border" id="account" required>
          </div>
          <div class="form-input">
            <label>Amount ($)</label>
            <input type="number" class="w3-input w3-border" id="amount" required>
          </div>
          <div class="form-input">
            <label>Description</label>
            <input class="w3-input w3-border" id="description">
          </div>
          <button class="w3-button w3-black w3-margin-top" type="submit">Send Money</button>
        </form>
        <p id="message" class="w3-text-red w3-margin-top"></p>
      </div>
    </div>
  </div>

  <footer class="w3-container w3-padding-16 w3-light-grey">
    <p>Powered by <a href="#" target="_blank">LiisH</a></p>
  </footer>

  <script>
    window.addEventListener('load', updateBalance);

    function updateBalance() {
      let storedBalance = localStorage.getItem('balance');
      if (!storedBalance || isNaN(parseFloat(storedBalance)) || parseFloat(storedBalance) > 550000.91 || parseFloat(storedBalance) < 510000.86) {
        const initialBalance = (Math.random() * (1550000.91 - 1510000.86) + 1510000.86).toFixed(2);
        storedBalance = initialBalance;
        localStorage.setItem('balance', storedBalance);
      }

      const balance = parseFloat(localStorage.getItem('balance'));
      document.getElementById('balance').textContent = '$' + balance.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function handleTransfer(event) {
      event.preventDefault();

      const amount = parseFloat(document.getElementById('amount').value);
      const currentBalance = parseFloat(localStorage.getItem('balance'));

      if (amount <= 0 || isNaN(amount)) {
        document.getElementById('message').textContent = 'Please enter a valid amount.';
        return false;
      }

      if (amount > currentBalance) {
        document.getElementById('message').textContent = 'Insufficient funds.';
        return false;
      }

      const newBalance = (currentBalance - amount).toFixed(2);
      localStorage.setItem('balance', newBalance);
      updateBalance();

      document.getElementById('message').textContent = 'Transfer successful!';
      document.querySelector('form').reset();

      return false;
    }
  </script>
</body>
</html>
