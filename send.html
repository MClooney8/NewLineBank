<!DOCTYPE html>
<html>
<head>
  <title>NEW LINE - SEND MONEY</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    html,body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
    .w3-container {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      background-color: #fff;
      padding: 16px;
      border-radius: 10px;
    }
    .w3-button {
      background-color: #4CAF50;
      color: #fff;
    }
    .w3-green {
      background-color: #4CAF50;
    }
    body {
      background-color: #fff;
    }
  </style>
</head>
<body class="w3-light-grey">
  <div class="w3-bar w3-striped w3-black w3-small">
    <span class="w3-bar-item">
      <a href="domsitee1.html">
        <img src="Newline.png" style="height: 82px;">
      </a>
    </span>
    <div class="w3-center">
      <h1>Transfer</h1>
    </div>
  </div>

  <div class="w3-card w3-padding-8 w3-center w3-animate-opacity" style="width: 50%; margin: 0 auto;">
    <form id="transferForm">
      <div class="w3-section">
        <label>Account Number</label>
        <input type="text" id="accountNumber" name="accountNumber" class="w3-input w3-border" required>
      </div>
      <div class="w3-section">
        <label>Bank Name</label>
        <input type="text" id="bankName" name="bankName" class="w3-input w3-border" required>
      </div>
      <div class="w3-section">
        <label>Sort Code</label>
        <input type="text" id="branchCode" name="branchCode" class="w3-input w3-border" pattern="[0-9]{6}" required>
      </div>
      <div class="w3-section">
        <label>Amount to Send</label>
        <input type="number" step="0.01" id="amount" name="amount" class="w3-input w3-border" required>
      </div>
      <button id="transferBtn" type="submit" class="w3-button w3-block w3-green w3-section">Transfer</button>
    </form>
  </div>

  <footer class="w3-container w3-padding-16 w3-light-grey">
    <p>Powered by <a href="#" target="_blank">LiisH</a></p>
  </footer>

<script>
  function updateBalance() {
    let storedBalance = localStorage.getItem('balance');
    if (!storedBalance || isNaN(parseFloat(storedBalance))) {
      storedBalance = (Math.random() * (550000.91 - 510000.86) + 510000.86).toFixed(2);
      localStorage.setItem('balance', storedBalance);
    }

    const balance = parseFloat(localStorage.getItem('balance'));
    document.getElementById('balance').textContent = '$' + balance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function sendMoney(amount) {
    let currentBalance = parseFloat(localStorage.getItem('balance'));
    amount = parseFloat(amount);
    
    if (isNaN(amount) || amount <= 0) {
      alert("Enter a valid amount.");
      return;
    }

    if (amount > currentBalance) {
      alert("Insufficient funds.");
      return;
    }

    let newBalance = (currentBalance - amount).toFixed(2);
    localStorage.setItem('balance', newBalance);
    updateBalance();
    alert(`$${amount.toLocaleString()} sent successfully! New balance is $${parseFloat(newBalance).toLocaleString(undefined, { minimumFractionDigits: 2 })}`);
  }

  window.addEventListener('load', updateBalance);
</script>
</body>
</html>
